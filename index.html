<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Práctica Render</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #feada6 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #4a2c3d;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(255, 154, 158, 0.35);
            text-align: center;
            max-width: 400px;
            width: 100%;
            border: 2px solid rgba(255, 255, 255, 0.6);
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 15px;
            color: #d81b60;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }
        p {
            font-size: 1.1rem;
            margin: 10px 0;
            line-height: 1.5;
            color: #6a1b4d;
        }
        .highlight {
            font-weight: bold;
            color: #ad1457;
            background: #ffe4ec;
            padding: 6px 14px;
            border-radius: 12px;
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>HOLA MUNDO</h1>
        <p><strong>Trabajo de:</strong><br>Tapia Gomez Maritza Suleyma</p>
        <div class="highlight">
            <p>Práctica de despliegue en Render</p>
        </div>
    </div>
</body>
</html>
